<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento de Turbinas Eólicas</title>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="head">
        <p>
            Parques Eólicos
        </p>
    </div>
    <div id="farms-container">
    </div>

    <button id="myBtn" onclick="modalNewWF()">Cadastrar</button>

    <div id="myModal" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <span class="close">&times;</span>
            <h2>Cadastro de novo Parque</h2>
        </div>
        <div class="modal-body">
            <label for="editWindFarmName">Nome:</label>
            <input type="text" id="editWindFarmName" class="input-field"><br>
            
            <label for="editWindFarmLoc">Localização:</label>
            <input type="text" id="editWindFarmLoc" class="input-field">
        </div>
        <div class="modal-footer"></div>
            <p class="errorMsg"></p>
            <button onclick="cadastroWFOK()"> OK </button>
        </div>
        </div>
    </div>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <h2>Deseja mesmo excluir o parque?</h2>
        </div>
        <div class="modal-body" id="modal-delete-wf">
            <button id="yesBtn">Sim</button>
            <button id="noBtn" >Não</button>
        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
