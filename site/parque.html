<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Turbina</title>
    <style>
    </style>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
</head>
<body>
    <h1>Aerogeradores</h1>   
    <h2 id="windFarmInfo"></h2>
    <button id="buttonHome" onclick="goToPage('home.html')">Voltar</button>
    <div id="turbines-container"></div>
    <div id="mapId"></div>

    <button id="myBtnWT" onclick="modalNewWT()">Cadastrar</button>

    <div id="newWT" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <span class="close">&times;</span>
            <h2>Cadastro de novo Aerogerador</h2>
        </div>
        <div class="modal-body">
            <label for="editWindFarmName">Código de identificação:</label>
            <input type="text" id="editWindTurbineIdCode" class="input-field"><br>

            <label for="editWindFarmName">Modelo:</label>
            <input type="text" id="editWindTurbineModel" class="input-field"><br>

            <label for="editWindFarmName">Latitude:</label>
            <input type="text" id="editWindTurbineLat" class="input-field"><br>
            
            <label for="editWindFarmLoc">Longitude:</label>
            <input type="text" id="editWindTurbineLon" class="input-field">
        </div>
        <div class="modal-footer"></div>
            <p class="errorMsg"></p>
            <button id="cadastroOKBtn", onclick="cadastroWTOK(parkId)"> OK </button>
        </div>
        </div>
    </div>

    <div id="deleteModalWT" class="modal">
        <div class="modal-content">
        <div class="modal-header">
            <h2>Deseja mesmo excluir o aerogerador?</h2>
        </div>
        <div class="modal-body" id="modal-delete">
            <button id="yesBtnWT">Sim</button>
            <button id="noBtnWT" >Não</button>
        </div>
    </div>

    <script src="script.js">
    </script>
</body>
</html>
